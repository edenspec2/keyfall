<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffffff'/%3E%3Crect x='7' y='5' width='5' height='14' rx='2' fill='%2322b8f0'/%3E%3Crect x='14' y='9' width='5' height='10' rx='2' fill='%23fb7a3c'/%3E%3Crect x='21' y='3' width='5' height='16' rx='2' fill='%236366f1'/%3E%3Crect x='5' y='22' width='22' height='6' rx='2' fill='%231d2233'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Keyfall</title>
    <script>
      // Apply the saved theme before the first paint, so a dark-theme user never sees a white flash.
      try {
        var t = (JSON.parse(localStorage.getItem('pianoapp.v1.settings') || '{}').theme) || 'light'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
