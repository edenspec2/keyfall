    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#fff5f9" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Mochi MIDI</title>
    <script>
      // Apply the saved theme before the first paint, so a dark-theme user never sees a white flash.
      try {
        var t = (JSON.parse(localStorage.getItem('pianoapp.v1.settings') || '{}').theme) || 'light'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
